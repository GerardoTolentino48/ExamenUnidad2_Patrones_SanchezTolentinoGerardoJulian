<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Patrones de Diseño</title>
    <link rel="stylesheet" href="Examen.css">
</head>
<body>
    <div class="contenedor-juego">
        <header class="encabezado-juego">
            <h1>Ciudad Peluche</h1>
            <div class="estadisticas">
                <div class="estadistica"> <!--Estadística son los contadores-->
                    <span class="etiqueta-estadistica">Ciudadanos:</span>
                    <span id="poblacion">0</span>
                </div>
                <div class="estadistica">
                    <span class="etiqueta-estadistica">Edificios:</span>
                    <span id="edificios">0</span>
                </div>
                <div class="estadistica">
                    <span class="etiqueta-estadistica">Vehículos:</span>
                    <span id="vehiculos">0</span>
                </div>
                <div class="estadistica">
                    <span class="etiqueta-estadistica">Recursos:</span>
                    <span id="recursos">1000</span>
                </div>
            </div>
        </header>

        <main class="area-principal">
            <div class="area-ciudad" id="areaCiudad">
            </div>

            <div class="controles">
                <div class="grupo-controles">
                    <button id="agregaredificio" class="boton-control">Agregar Edificio (200)</button>
                    <button id="removeBuilding" class="boton-control quitar">Quitar Edificio (+100)</button>
                </div>
                <div class="grupo-controles">
                    <button id="addVehicle" class="boton-control">Agregar Vehículo (100)</button>
                    <button id="removeVehicle" class="boton-control quitar">Quitar Vehículo (+50)</button>
                </div>
                <div class="grupo-controles">
                    <button id="agregarciudadano" class="boton-control">Agregar Ciudadano (50)</button>
                    <button id="removeCitizen" class="boton-control quitar">Quitar Ciudadano (+25)</button>
                </div>
                <div class="grupo-controles">
                    <button id="recycleAll" class="boton-control reciclar">Reciclar Todo</button>
                </div>
                <div class="grupo-controles">
                    <button id="testSingleton" class="boton-control singleton">Probar Singleton</button>
                </div>
            </div>
        </main>

        <!-- Pool de Objetos -->
        <div class="panel-pool-objetos" id="objectPoolPanel">
            <h3>Pool de Objetos</h3>
            <div class="seccion-pool">
                <h4>Edificios Disponibles</h4>
                <div class="items-pool" id="edificioPool">
                    <!-- Objetos del pool de edificios -->
                </div>
            </div>
            <div class="seccion-pool">
                <h4>Vehículos Disponibles</h4>
                <div class="items-pool" id="vehiculoPool">
                    <!-- Objetos del pool de vehículos -->
                </div>
            </div>
            <div class="seccion-pool">
                <h4>Ciudadanos Disponibles</h4>
                <div class="items-pool" id="ciudadanoPool">
                    <!-- Objetos del pool de ciudadanos -->
                </div>
            </div>
        </div>
    </div>

    <script>
        class GestorJuego 
        {
            constructor() 
            {
                if (GestorJuego.instancia) 
                {
                    return GestorJuego.instancia;
                }
                
                this.poblacion = 0;
                this.edificios = 0;
                this.vehiculos = 0;
                this.recursos = 1000;
                this.objetosActivos = [];
                
                GestorJuego.instancia = this;
                this.actualizarInterfaz();
            }

            static obtenerInstancia() 
            {
                if (!GestorJuego.instancia) 
                {
                    GestorJuego.instancia = new GestorJuego();
                }
                return GestorJuego.instancia;
            }

            agregarObjeto(obj) 
            {
                this.objetosActivos.push(obj);
                this.actualizarEstadisticas();
                this.actualizarInterfaz();
            }

            removerObjeto(obj) 
            {
                const indice = this.objetosActivos.indexOf(obj);
                if (indice > -1) 
                {
                    this.objetosActivos.splice(indice, 1);
                    this.actualizarEstadisticas();
                    this.actualizarInterfaz();
                }
            }

            actualizarEstadisticas() 
            {
                this.poblacion = this.objetosActivos.filter(obj => obj.tipo === 'ciudadano').length;
                this.edificios = this.objetosActivos.filter(obj => obj.tipo === 'edificio').length;
                this.vehiculos = this.objetosActivos.filter(obj => obj.tipo === 'vehiculo').length;
            }

            actualizarInterfaz() 
            {
                document.getElementById('poblacion').textContent = this.poblacion;
                document.getElementById('edificios').textContent = this.edificios;
                document.getElementById('vehiculos').textContent = this.vehiculos;
                document.getElementById('recursos').textContent = this.recursos;
            }

            reciclarTodo() 
            {
                this.objetosActivos.forEach(obj => 
                {
                    obj.reciclar();
                });
                this.objetosActivos = [];
                this.actualizarEstadisticas();
                this.actualizarInterfaz();
            }
        }

        class PoolObjetos 
        {
            constructor(funcionCrear, funcionReset, tamanoInicial = 5) 
            {
                this.funcionCrear = funcionCrear;
                this.funcionReset = funcionReset;
                this.pool = [];
                this.activos = [];
                
                for (let i = 0; i < tamanoInicial; i++) 
                {
                    this.pool.push(this.funcionCrear());
                }
            }

            obtener() 
            {
                if (this.pool.length === 0) 
                {
                    return null;
                }
                
                const obj = this.pool.pop();
                this.activos.push(obj);
                return obj;
            }

            liberar(obj) 
            {
                const indice = this.activos.indexOf(obj);
                if (indice > -1) 
                {
                    this.activos.splice(indice, 1);//Quita de activos el objeto 
                    this.funcionReset(obj);//Llama a la función de reset del objeto
                    this.pool.push(obj);//Regresa el objeto al pool
                }
            }

            obtenerTamanoPool() 
            {
                return this.pool.length;
            }

            obtenerTamanoActivos() 
            {
                return this.activos.length;
            }
        }

        class Edificio 
        {
            constructor() 
            {
                this.tipo = 'edificio';
                this.elemento = null;
                this.estaActivo = false;
                this.x = 0;
                this.y = 0;
            }

            activar(x, y) 
            {
                this.estaActivo = true;
                this.x = x;
                this.y = y;
                this.crearElemento();
                return this;
            }

            crearElemento() 
            {
                this.elemento = document.createElement('div');
                this.elemento.className = 'edificio';
                this.elemento.style.left = this.x + 'px';
                this.elemento.style.top = this.y + 'px';
                this.elemento.innerHTML = 'EDIFICIO';
                document.getElementById('areaCiudad').appendChild(this.elemento);
            }

            reciclar() 
            {
                if (this.elemento) 
                {
                    this.elemento.remove();
                }
                this.estaActivo = false;
                this.elemento = null;
            }
        }

        class Vehiculo 
        {
            constructor() 
            {
                this.tipo = 'vehiculo';
                this.elemento = null;
                this.estaActivo = false;
                this.x = 0;
                this.y = 0;
            }

            activar(x, y) 
            {
                this.estaActivo = true;
                this.x = x;
                this.y = y;
                this.crearElemento();
                return this;
            }

            crearElemento() 
            {
                this.elemento = document.createElement('div');
                this.elemento.className = 'vehiculo';
                this.elemento.style.left = this.x + 'px';
                this.elemento.style.top = this.y + 'px';
                this.elemento.innerHTML = 'VEHÍCULO';
                document.getElementById('areaCiudad').appendChild(this.elemento);
            }

            reciclar() 
            {
                if (this.elemento) 
                {
                    this.elemento.remove();
                }
                this.estaActivo = false;
                this.elemento = null;
            }
        }

        class Ciudadano 
        {
            constructor() 
            {
                this.tipo = 'ciudadano';
                this.elemento = null;
                this.estaActivo = false;
                this.x = 0;
                this.y = 0;
            }

            activar(x, y) 
            {
                this.estaActivo = true;
                this.x = x;
                this.y = y;
                this.crearElemento();
                return this;
            }

            crearElemento() 
            {
                this.elemento = document.createElement('div');
                this.elemento.className = 'ciudadano';
                this.elemento.style.left = this.x + 'px';
                this.elemento.style.top = this.y + 'px';
                this.elemento.innerHTML = 'CIUDADANO';
                document.getElementById('areaCiudad').appendChild(this.elemento);
            }

            reciclar() 
            {
                if (this.elemento) 
                {
                    this.elemento.remove();
                }
                this.estaActivo = false;
                this.elemento = null;
            }
        }

        const gestorJuego = GestorJuego.obtenerInstancia();
        const poolEdificios = new PoolObjetos(
            () => new Edificio(),
            (obj) => obj.reciclar(),
            5
        );

        const poolVehiculos = new PoolObjetos(
            () => new Vehiculo(),
            (obj) => obj.reciclar(),
            5
        );

        const poolCiudadanos = new PoolObjetos(
            () => new Ciudadano(),
            (obj) => obj.reciclar(),
            5
        );

        function actualizarVisualizacionPool() 
        {
            actualizarSeccionPool('edificioPool', poolEdificios, 'EDIFICIO');
            actualizarSeccionPool('vehiculoPool', poolVehiculos, 'VEHÍCULO');
            actualizarSeccionPool('ciudadanoPool', poolCiudadanos, 'CIUDADANO');
        }

        function actualizarSeccionPool(idContenedor, pool, texto) 
        {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '';
            
            for (let i = 0; i < pool.obtenerTamanoPool(); i++) 
            {
                const itemPool = document.createElement('div');
                itemPool.className = 'item-pool';
                itemPool.innerHTML = texto;
                contenedor.appendChild(itemPool);
            }
        }

        function obtenerPosicionAleatoria() 
        {
            const areaCiudad = document.getElementById('areaCiudad');
            const rectangulo = areaCiudad.getBoundingClientRect();
            return {
                x: Math.random() * (rectangulo.width - 50),
                y: Math.random() * (rectangulo.height - 50)
            };
        }

        const costoEdificio = 200;
        const costoVehiculo = 100;
        const costoCiudadano = 50;
        function comprobarSingleton() 
        {
            const instanciaUno = GestorJuego.obtenerInstancia();
            const instanciaDos = GestorJuego.obtenerInstancia();
            const esSingleton = (instanciaUno === instanciaDos);
            
            const mensaje = `COMPROBACIÓN DE SINGLETON:\n\n` +
                          `¿Son la misma instancia? ${esSingleton ? 'SÍ' : 'NO'}\n\n` +
                          `Singleton OK: ${esSingleton}\n\n`;
            
            alert(mensaje);
            
            console.log('=== COMPROBACIÓN DE SINGLETON ===');
            console.log('Instancia 1:', instanciaUno);
            console.log('Instancia 2:', instanciaDos);
            console.log('¿Son iguales?', esSingleton);
            console.log('Singleton OK:', esSingleton);
            console.log('===============================');
        }

        document.getElementById('agregaredificio').addEventListener('click', () => 
        {
            if (gestorJuego.recursos < costoEdificio) 
            {
                return;
            }

            const posicion = obtenerPosicionAleatoria();
            const edificio = poolEdificios.obtener();
            
            if (edificio === null) 
            {
                return;
            }
            
            gestorJuego.recursos -= costoEdificio;
            edificio.activar(posicion.x, posicion.y);
            gestorJuego.agregarObjeto(edificio);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('addVehicle').addEventListener('click', () => 
        {
            if (gestorJuego.recursos < costoVehiculo) 
            {
                return;
            }

            const posicion = obtenerPosicionAleatoria();
            const vehiculo = poolVehiculos.obtener();
            
            if (vehiculo === null)  // Si no hay vehículos disponibles, no se agrega
            {
                return;
            }
            
            gestorJuego.recursos -= costoVehiculo;
            vehiculo.activar(posicion.x, posicion.y);
            gestorJuego.agregarObjeto(vehiculo);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('agregarciudadano').addEventListener('click', () => 
        {
            if (gestorJuego.recursos < costoCiudadano) 
            {
                return;
            }

            const posicion = obtenerPosicionAleatoria();
            const ciudadano = poolCiudadanos.obtener();
            
            if (ciudadano === null) 
            {
                return;
            }
            
            gestorJuego.recursos -= costoCiudadano;
            ciudadano.activar(posicion.x, posicion.y);
            gestorJuego.agregarObjeto(ciudadano);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('removeBuilding').addEventListener('click', () => {
            const edificiosActivos = gestorJuego.objetosActivos.filter(obj => obj.tipo === 'edificio');
            
            if (edificiosActivos.length === 0) 
            {
                return;
            }
            
            const edificioAQuitar = edificiosActivos[edificiosActivos.length - 1];
            gestorJuego.recursos += Math.floor(costoEdificio * 0.5);
            poolEdificios.liberar(edificioAQuitar);
            gestorJuego.removerObjeto(edificioAQuitar);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('removeVehicle').addEventListener('click', () => 
        {
            const vehiculosActivos = gestorJuego.objetosActivos.filter(obj => obj.tipo === 'vehiculo');
            
            if (vehiculosActivos.length === 0) 
            {
                return;
            }
            
            const vehiculoAQuitar = vehiculosActivos[vehiculosActivos.length - 1];
            gestorJuego.recursos += Math.floor(costoVehiculo * 0.5);
            poolVehiculos.liberar(vehiculoAQuitar);
            gestorJuego.removerObjeto(vehiculoAQuitar);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('removeCitizen').addEventListener('click', () => 
        {
            const ciudadanosActivos = gestorJuego.objetosActivos.filter(obj => obj.tipo === 'ciudadano');
            
            if (ciudadanosActivos.length === 0) 
            {
                return;
            }
            
            const ciudadanoAQuitar = ciudadanosActivos[ciudadanosActivos.length - 1];
            gestorJuego.recursos += Math.floor(costoCiudadano * 0.5);
            poolCiudadanos.liberar(ciudadanoAQuitar);
            gestorJuego.removerObjeto(ciudadanoAQuitar);
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('recycleAll').addEventListener('click', () => 
        {
            let recursosADevolver = 0;
            gestorJuego.objetosActivos.forEach(obj => 
            {
                if (obj.tipo === 'edificio') 
                {
                    recursosADevolver += Math.floor(costoEdificio * 0.5);
                } else if (obj.tipo === 'vehiculo') 
                {
                    recursosADevolver += Math.floor(costoVehiculo * 0.5);
                } else if (obj.tipo === 'ciudadano') 
                {
                    recursosADevolver += Math.floor(costoCiudadano * 0.5);
                }
            });
            
            gestorJuego.objetosActivos.forEach(obj => {
                if (obj.tipo === 'edificio') 
                {
                    poolEdificios.liberar(obj);
                } else if (obj.tipo === 'vehiculo') 
                {
                    poolVehiculos.liberar(obj);
                } else if (obj.tipo === 'ciudadano') 
                {
                    poolCiudadanos.liberar(obj);
                }
            });
            
            gestorJuego.recursos += recursosADevolver;
            gestorJuego.reciclarTodo();
            gestorJuego.actualizarInterfaz();
            actualizarVisualizacionPool();
        });

        document.getElementById('testSingleton').addEventListener('click', () => 
        {
            comprobarSingleton();
        });

        actualizarVisualizacionPool();
    </script>
</body>
</html>
